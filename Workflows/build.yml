name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the files into an Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/tayb/office app/src/main/res/mipmap-xxhdpi
          cp index.html app/src/main/assets/index.html
          cp MainActivity.java app/src/main/java/com/tayb/office/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app-build.gradle app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TaybOffice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
